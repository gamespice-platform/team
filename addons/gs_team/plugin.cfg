[plugin]

name="gs-team"
description="Sides that outlive a match: definitions carrying the colour, the friendly-fire rule and the open-ended attributes every other addon reads; a policy for joining, switching and locking; deterministic, explainable autobalance; a roster that mirrors to clients and can drive gs-match; and the spectating half — who may watch whom, by side, over a duck-typed gs-spectate. Depends only on gs-core."
author="dot"
version="0.1.0"
script="gs_team_plugin.gd"
